<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cakino - The Cake Art</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body
    class="bg-slate-100 font-sans text-slate-800 antialiased min-h-screen flex flex-col lg:flex-row overflow-x-hidden">

    <!-- Mobile Sidebar Backdrop Overlay -->
    <div id="sidebarBackdrop" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 lg:hidden hidden"></div>

    <!-- Responsive Sidebar Navigation -->
    <aside id="sidebar"
        class="fixed lg:static top-0 left-0 bottom-0 w-64 bg-slate-900 text-white z-50 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col justify-between border-r border-slate-800">

        <div>
            <!-- Sidebar Header / Brand Logo -->
            <div class="p-5 border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div
                        class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-600 to-pink-500 flex items-center justify-center text-white text-xl shadow-md">
                        <i class="fa-solid fa-cake-candles"></i>
                    </div>
                    <div>
                        <h1 class="font-display font-bold text-lg text-white leading-tight">Cakino</h1>
                        <p class="text-[11px] text-rose-400 font-medium">The Cake Art</p>
                    </div>
                </div>
            </div>

            <!-- Navigation Links -->
            <nav class="p-4 space-y-1.5 text-xs">
                <a href="#dashboard" data-page="dashboard"
                    class="nav-link flex items-center gap-3 px-3.5 py-3 rounded-xl transition">
                    <i class="fa-solid fa-chart-pie w-4 text-center"></i>
                    <span>Dashboard</span>
                </a>

                <a href="#orders" data-page="orders"
                    class="nav-link flex items-center gap-3 px-3.5 py-3 rounded-xl transition">
                    <i class="fa-solid fa-list-check w-4 text-center"></i>
                    <span>Order List</span>
                </a>

                <a href="#billing" data-page="billing"
                    class="nav-link flex items-center gap-3 px-3.5 py-3 rounded-xl transition">
                    <i class="fa-solid fa-receipt w-4 text-center"></i>
                    <span>Billing System</span>
                </a>

                <a href="#products" data-page="products"
                    class="nav-link flex items-center gap-3 px-3.5 py-3 rounded-xl transition text-slate-300 hover:bg-slate-800 hover:text-white font-semibold">
                    <i class="fa-solid fa-boxes-stacked w-4 text-center"></i>
                    <span>Products</span>
                </a>

                <a href="#settings" data-page="settings"
                    class="nav-link flex items-center gap-3 px-3.5 py-3 rounded-xl transition text-slate-300 hover:bg-slate-800 hover:text-white font-semibold">
                    <i class="fa-solid fa-gear w-4 text-center"></i>
                    <span>Settings</span>
                </a>
            </nav>
        </div>

        <!-- Sidebar Footer / Logout -->
        <div class="p-4 border-t border-slate-800">
            <div class="bg-slate-800/80 rounded-xl p-3 mb-3 flex items-center gap-3">
                <div
                    class="w-8 h-8 rounded-lg bg-rose-500/20 text-rose-400 font-bold text-xs flex items-center justify-center">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <div class="truncate">
                    <span id="loggedInUserDisplay"
                        class="font-bold text-white text-xs block truncate">Administrator</span>
                    <span class="text-[10px] text-slate-400">Logged in</span>
                </div>
            </div>

            <button type="button" id="logoutBtn"
                class="w-full flex items-center justify-center gap-2 px-3.5 py-2.5 rounded-xl bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white font-semibold text-xs transition">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
            </button>
        </div>

    </aside>

    <!-- Main Content Layout Container -->
    <div class="flex-1 flex flex-col min-w-0 min-h-screen">

        <!-- Top Header Navigation Bar -->
        <header
            class="no-print bg-white border-b border-slate-200/80 px-4 sm:px-6 py-3.5 flex items-center justify-between sticky top-0 z-30 shadow-xs">
            <div class="flex items-center gap-3">
                <!-- Mobile Hamburger Button -->
                <button type="button" id="sidebarToggleBtn"
                    class="lg:hidden w-9 h-9 rounded-lg bg-slate-100 text-slate-700 flex items-center justify-center hover:bg-slate-200 transition">
                    <i class="fa-solid fa-bars text-sm"></i>
                </button>
                <h2 id="headerTitle" class="font-display font-bold text-lg text-slate-800">Dashboard</h2>
            </div>

            <div class="flex items-center gap-3">
                <!-- Top header action icons/controls if needed -->
            </div>
        </header>

        <!-- Main Dynamic View Area -->
        <main id="mainContent" class="flex-1 p-4 sm:p-6 transition-opacity duration-200">
            <!-- Dynamic page content loaded here from pages/*.html -->
        </main>

    </div>

    <!-- Toast Notification Popup -->
    <div id="toast"
        class="hidden-toast fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl border border-slate-800 flex items-center gap-3 text-xs max-w-sm">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 text-base"></i>
        <span id="toastMessage">Action completed successfully.</span>
    </div>

    <!-- Application JavaScript Bundles (100% Live Core PHP API) -->
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/dashboard.js"></script>
    <script src="assets/js/billing.js"></script>
    <script src="assets/js/orders.js"></script>
    <script src="assets/js/products.js"></script>
    <script src="assets/js/settings.js"></script>
    <script src="assets/js/app.js"></script>
</body>

</html>
