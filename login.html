<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cakino Login</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Auth JS -->
    <script src="assets/js/auth.js"></script>
</head>

<body class="bg-slate-900 font-sans text-slate-800 antialiased min-h-screen flex items-center justify-center p-4">

    <!-- Login Container Card -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-700/50">

        <!-- Header Banner -->
        <div
            class="bg-gradient-to-r from-rose-600 via-pink-600 to-rose-500 text-white p-8 text-center relative overflow-hidden">
            <div class="absolute -right-8 -bottom-8 w-32 h-32 bg-white/10 rounded-full blur-xl pointer-events-none">
            </div>

            <div
                class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-white/20 backdrop-blur-md text-white text-2xl shadow-inner border border-white/30 mb-3">
                <i class="fa-solid fa-cake-candles"></i>
            </div>

            <h1 class="font-display font-bold text-2xl tracking-tight">Cakino</h1>
            <p class="text-xs text-rose-100 mt-1 font-medium">The Cake Art</p>
        </div>

        <!-- Login Form Area -->
        <div class="p-6 sm:p-8">

            <div id="alertBox"
                class="hidden mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-red-600 text-xs font-semibold flex items-center gap-2">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="alertMessage">Invalid username or password!</span>
            </div>

            <form id="loginForm" class="space-y-4" novalidate>

                <!-- Username Input -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Username</label>
                    <div class="relative">
                        <span class="absolute left-3 top-2.5 text-slate-400 text-xs"><i
                                class="fa-solid fa-user"></i></span>
                        <input type="text" id="username"
                            class="w-full bg-slate-50 border border-slate-300 rounded-lg pl-9 pr-3 py-2 text-xs text-slate-800 focus:outline-none focus:border-rose-500 focus:ring-2 focus:ring-rose-200 font-medium"
                            placeholder="Enter username (admin)">
                    </div>
                    <span id="usernameErr" class="text-[11px] text-red-500 hidden mt-0.5">Username is required</span>
                </div>

                <!-- Password Input -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Password</label>
                    <div class="relative">
                        <span class="absolute left-3 top-2.5 text-slate-400 text-xs"><i
                                class="fa-solid fa-lock"></i></span>
                        <input type="password" id="password"
                            class="w-full bg-slate-50 border border-slate-300 rounded-lg pl-9 pr-10 py-2 text-xs text-slate-800 focus:outline-none focus:border-rose-500 focus:ring-2 focus:ring-rose-200 font-medium"
                            placeholder="Enter password (admin123)">
                        <button type="button" id="togglePassword"
                            class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600 text-xs focus:outline-none">
                            <i class="fa-solid fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                    <span id="passwordErr" class="text-[11px] text-red-500 hidden mt-0.5">Password is required</span>
                </div>

                <!-- Remember Me & Predefined Notice -->
                <div class="flex items-center justify-between text-xs pt-1">
                    <label class="flex items-center gap-2 text-slate-600 cursor-pointer select-none">
                        <input type="checkbox" id="rememberMe"
                            class="rounded border-slate-300 text-rose-600 focus:ring-rose-500">
                        <span>Remember Me</span>
                    </label>
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button type="submit"
                        class="w-full py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs rounded-xl shadow-md transition flex items-center justify-center gap-2">
                        <span>Sign In to Dashboard</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                </div>

            </form>

            <!-- Predefined Credentials Helper Card -->
            <!-- <div class="mt-6 p-3 rounded-xl bg-slate-100 border border-slate-200 text-xs text-slate-600">
                <div class="font-bold text-slate-800 flex items-center gap-1.5 mb-1">
                    <i class="fa-solid fa-key text-rose-500"></i> Demo Credentials
                </div>
                <div class="grid grid-cols-2 gap-1 text-[11px] font-mono">
                    <div>User: <span class="font-bold text-slate-900">admin</span></div>
                    <div>Pass: <span class="font-bold text-slate-900">admin123</span></div>
                </div>
            </div> -->

        </div>

    </div>

    <!-- Login Script -->
    <script>
        $(document).ready(function () {

            // Redirect if already logged in
            CakeAuth.checkAlreadyLoggedIn();

            // Toggle Password Visibility
            $('#togglePassword').click(function () {
                const passInput = $('#password');
                const eyeIcon = $('#eyeIcon');

                if (passInput.attr('type') === 'password') {
                    passInput.attr('type', 'text');
                    eyeIcon.removeClass('fa-eye').addClass('fa-eye-slash');
                } else {
                    passInput.attr('type', 'password');
                    eyeIcon.removeClass('fa-eye-slash').addClass('fa-eye');
                }
            });

            // Form Submit with Validation
            $('#loginForm').submit(function (e) {
                e.preventDefault();

                const username = $('#username').val().trim();
                const password = $('#password').val().trim();
                let isValid = true;

                // Reset errors
                $('#alertBox').addClass('hidden');
                $('#usernameErr').addClass('hidden');
                $('#passwordErr').addClass('hidden');

                if (!username) {
                    $('#usernameErr').removeClass('hidden');
                    isValid = false;
                }

                if (!password) {
                    $('#passwordErr').removeClass('hidden');
                    isValid = false;
                }

                if (!isValid) return;

                // Authenticate
                const res = CakeAuth.login(username, password);

                if (res.success) {
                    window.location.href = 'index.html';
                } else {
                    $('#alertMessage').text(res.message);
                    $('#alertBox').removeClass('hidden');
                }
            });

        });
    </script>
</body>

</html>
